<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomoce Szkolne</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>body { font-family: 'Nunito', sans-serif; }</style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 flex flex-col items-center justify-center p-4 sm:p-6 lg:p-8">
    <div class="w-full max-w-2xl mx-auto bg-white rounded-3xl shadow-xl text-center p-8 border-4 border-indigo-100">
        <div class="w-24 h-24 bg-indigo-100 rounded-full flex items-center justify-center mx-auto mb-6">
            <i data-lucide="graduation-cap" class="w-12 h-12 text-indigo-600"></i>
        </div>
        <h1 class="text-4xl sm:text-5xl font-black mb-4 tracking-tight">Pomoce Szkolne</h1>
        <p class="text-slate-600 mb-8 text-lg font-medium">Wybierz przedmiot:</p>

        <div class="flex flex-col gap-4">
            <a href="matematyka/" class="w-full py-5 px-6 bg-indigo-600 hover:bg-indigo-700 text-white text-2xl font-black rounded-2xl shadow-lg transform transition active:scale-95 flex items-center justify-center gap-3">
                <i data-lucide="calculator" class="w-7 h-7"></i>
                Matematyka
            </a>
            <a href="angielski/" class="w-full py-5 px-6 bg-emerald-500 hover:bg-emerald-600 text-white text-2xl font-black rounded-2xl shadow-lg transform transition active:scale-95 flex items-center justify-center gap-3">
                <i data-lucide="languages" class="w-7 h-7"></i>
                Angielski

        </div>
    </div>
    <script>lucide.createIcons();</script>

</html>
